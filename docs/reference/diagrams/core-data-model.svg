<text x="70" y="856" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Invoice posting is one transaction: stock movement + average-cost update + GL journal + audit/outbox + status flip. Cancellation is a reversal, never a delete.</text>
<text x="70" y="896.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f646b">FiscalPeriod and Currency also attach to Invoice, JournalEntry and StockMovement. Full column-by-column detail lives in docs/database.md and docs/DATABASE_SCHEMA.md; the schema files are authoritative.</text>
  <text x="64" y="954" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5f646b">Sanad ERP · docs/reference/diagrams · snapshot b306db3 · 2026-10-24</text>
