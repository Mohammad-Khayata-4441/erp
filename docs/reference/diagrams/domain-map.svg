<text x="70" y="804.5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f646b">Arrow = “depends on”. The map shows the main runtime spine; exact dependsOn lists (including identity → accounting/catalog/invoicing/platform, reports → invoicing and POS → parties) are in 02-api.md. identity</text><text x="70" y="820.125" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f646b">is the shared auth kernel: every domain may import JwtAuthGuard / @CurrentUser.</text>

