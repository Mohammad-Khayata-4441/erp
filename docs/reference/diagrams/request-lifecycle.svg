  <text x="64" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1e1e1e">CRUD request lifecycle</text>
  <text x="66" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5f646b">From a dashboard click to a tenant-scoped PostgreSQL transaction and back</text>
  <line x1="64" y1="110" x2="1536" y2="110" stroke="#1e1e1e" stroke-width="1.5" opacity="0.18" />
  
  <g>
    <rect x="39" y="164" width="234" height="300" rx="14" fill="#1e1e1e" opacity="0.06" />
    <rect x="36" y="160" width="234" height="300" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2" />
    <text x="50" y="273.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#1e1e1e">1 · Browser</text>
    <text x="50" y="302.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">User clicks Create / Save</text><text x="50" y="318.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">or changes table query.</text><text x="50" y="334.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b"></text><text x="50" y="350.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">No direct API fetch in</text><text x="50" y="366.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">the feature component.</text>
  </g>

  <g>
    <rect x="297" y="164" width="234" height="300" rx="14" fill="#1e1e1e" opacity="0.06" />
    <rect x="294" y="160" width="234" height="300" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2" />
    <text x="308" y="281.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#1e1e1e">2 · Next.js</text>
    <text x="308" y="310.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">Thin route renders a</text><text x="308" y="326.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">client module component.</text><text x="308" y="342.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">useApi() resolves the</text><text x="308" y="358.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">ApiClient with JWT + locale.</text>
  </g>

  <g>
    <rect x="555" y="164" width="234" height="300" rx="14" fill="#1e1e1e" opacity="0.06" />
    <rect x="552" y="160" width="234" height="300" rx="14" fill="#ffe8cc" stroke="#e8590c" stroke-width="2" />
    <text x="566" y="281.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#1e1e1e">3 · API edge</text>
    <text x="566" y="310.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">JwtAuthGuard validates token.</text><text x="566" y="326.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">PermissionsGuard checks key.</text><text x="566" y="342.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">DomainAvailabilityGuard</text><text x="566" y="358.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">checks DISABLED_DOMAINS.</text>
  </g>

  <g>
    <rect x="813" y="164" width="234" height="300" rx="14" fill="#1e1e1e" opacity="0.06" />
    <rect x="810" y="160" width="234" height="300" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2" />
    <text x="824" y="281.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#1e1e1e">4 · Controller</text>
    <text x="824" y="310.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">ValidationPipe: whitelist +</text><text x="824" y="326.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">transform. CRUD factory reads</text><text x="824" y="342.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">@CurrentUser().tenantId and</text><text x="824" y="358.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">calls the service.</text>
  </g>

  <g>
    <rect x="1071" y="164" width="234" height="300" rx="14" fill="#1e1e1e" opacity="0.06" />
    <rect x="1068" y="160" width="234" height="300" rx="14" fill="#e5dbff" stroke="#6741d9" stroke-width="2" />
    <text x="1082" y="273.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#1e1e1e">5 · Domain</text>
    <text x="1082" y="302.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">Service before* hooks enforce</text><text x="1082" y="318.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">business rules. Repository</text><text x="1082" y="334.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">adds</text><text x="1082" y="350.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">tenantId. Presenter maps the</text><text x="1082" y="366.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">entity to response DTO.</text>
  </g>

  <g>
    <rect x="1329" y="164" width="234" height="300" rx="14" fill="#1e1e1e" opacity="0.06" />
    <rect x="1326" y="160" width="234" height="300" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2" />
    <text x="1340" y="273.7" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#1e1e1e">6 · PostgreSQL</text>
    <text x="1340" y="302.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">Prisma transaction commits.</text><text x="1340" y="318.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">AuditLog / Outbox may share</text><text x="1340" y="334.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">the same tx. Envelope</text><text x="1340" y="350.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">returns;</text><text x="1340" y="366.3" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">React Query invalidates.</text>
  </g>
