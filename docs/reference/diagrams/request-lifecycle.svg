<text x="540" y="525" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2f9e44">success envelope → cache invalidation → render</text>
<text x="70" y="612" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c92a2a">WHERE IT BREAKS (most common in this repo)</text>

  <g>
    <rect x="73" y="634" width="466" height="108" rx="14" fill="#1e1e1e" opacity="0.06" />
    <rect x="70" y="630" width="466" height="108" rx="14" fill="#f1f3f5" stroke="#c92a2a" stroke-width="2" />
    <text x="84" y="670.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#1e1e1e">401/403</text>
    <text x="84" y="697.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">Token missing, expired, or permission key not granted to the</text><text x="84" y="713.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">role.</text>
  </g>

  <g>
    <rect x="573" y="634" width="466" height="108" rx="14" fill="#1e1e1e" opacity="0.06" />
    <rect x="570" y="630" width="466" height="108" rx="14" fill="#f1f3f5" stroke="#c92a2a" stroke-width="2" />
    <text x="584" y="670.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#1e1e1e">400 validation</text>
    <text x="584" y="697.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">DTO shape and dashboard Zod schema drifted. Regenerate + align</text><text x="584" y="713.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">mappers.</text>
  </g>

  <g>
    <rect x="1073" y="634" width="466" height="108" rx="14" fill="#1e1e1e" opacity="0.06" />
    <rect x="1070" y="630" width="466" height="108" rx="14" fill="#f1f3f5" stroke="#c92a2a" stroke-width="2" />
    <text x="1084" y="670.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#1e1e1e">404 tenant scope</text>
    <text x="1084" y="697.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">Row exists for another tenant, or route prefix / domain is</text><text x="1084" y="713.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">disabled.</text>
  </g>

  <g>
    <rect x="73" y="766" width="466" height="108" rx="14" fill="#1e1e1e" opacity="0.06" />
    <rect x="70" y="762" width="466" height="108" rx="14" fill="#f1f3f5" stroke="#c92a2a" stroke-width="2" />
    <text x="84" y="802.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#1e1e1e">409 conflict</text>
    <text x="84" y="829.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">Unique constraint (code/name) or FK still referenced by</text><text x="84" y="845.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">another row.</text>
  </g>

  <g>
    <rect x="573" y="766" width="466" height="108" rx="14" fill="#1e1e1e" opacity="0.06" />
    <rect x="570" y="762" width="466" height="108" rx="14" fill="#f1f3f5" stroke="#c92a2a" stroke-width="2" />
    <text x="584" y="802.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#1e1e1e">Posting 400</text>
    <text x="584" y="829.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">GL mapping missing, fiscal period closed, or stock</text><text x="584" y="845.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">unavailable.</text>
  </g>

  <g>
    <rect x="1073" y="766" width="466" height="108" rx="14" fill="#1e1e1e" opacity="0.06" />
    <rect x="1070" y="762" width="466" height="108" rx="14" fill="#f1f3f5" stroke="#c92a2a" stroke-width="2" />
    <text x="1084" y="810.9" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#1e1e1e">Preview/print 404</text>
    <text x="1084" y="837.1" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f646b">ID belongs to another tenant; never query without tenantId.</text>
  </g>
<text x="70" y="925" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f646b">The controller may add HTTP-level before/after hooks, but business rules belong in the service. A disabled domain is rejected before the controller is reached.</text>
  <text x="64" y="954" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5f646b">Sanad ERP · docs/reference/diagrams · snapshot b306db3 · 2026-10-24</text>
