<text x="70" y="885" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f646b">The dashboard never calls fetch directly for CRUD. It goes through Modules → generated Resource → typed client → ApiClient → NestJS controller.</text>
